  <script>
    window.bootTheme = "slate";
    var themeColors = {
      slate: "rgb(29, 30, 32)",
      midnight: "rgb(0, 0, 0)",
      dusk: "rgb(23, 26, 33)",
      graphite: "rgb(18, 18, 18)",
      plum: "rgb(28, 24, 29)",
      ash: "rgb(26, 24, 22)",
      jade: "rgb(26, 30, 29)",
      strawberry: "rgb(92, 18, 38)",
      beach: "rgb(8, 53, 57)",
      mahogany: "rgb(58, 29, 21)",
      navy: "rgb(15, 26, 51)",
      marine: "rgb(15, 26, 51)",
      milkshake: "rgb(255, 250, 251)",
      sky: "rgb(247, 251, 255)",
      lime: "rgb(250, 253, 246)",
      oatmeal: "rgb(247, 241, 230)",
      latte: "rgb(236, 220, 207)"
    };
    var lightThemes = { milkshake: true, sky: true, lime: true, oatmeal: true, latte: true };
    var saved;
    var theme;
    try {
      saved = JSON.parse(localStorage.getItem("theme-state") || "{}");
      theme = saved?.state?.theme;
      if (themeColors[theme]) {
        window.bootTheme = theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.setProperty("--splash-bg", themeColors[theme]);
        document.querySelector("meta[name='theme-color']").content = themeColors[theme];
      }
    } catch (_e) { }
    document.documentElement.style.colorScheme = lightThemes[window.bootTheme] ? "light" : "dark";
  </script>
